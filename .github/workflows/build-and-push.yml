# Build & push : main -> bump version + scan Trivy + push GHCR + pin digest dans values.yaml
# ArgoCD reprend ensuite le relai et déploie sur le cluster.
#
# Runners GitHub-hosted ubuntu-latest (illimités pour repo public).
# pnpm + minimum-release-age 24h pour défense supply-chain.
#
# Secrets GitHub requis : aucun en dehors du GITHUB_TOKEN fourni par la plateforme.
#
# Le workflow montait auparavant un kubeconfig complet du cluster sur le runner
# pour lire zenix-backend-secrets et en extraire deux variables de build. Cette
# étape a été supprimée :
#   - elle exposait l'intégralité du secret (clé privée JWT, token Gotify) à un
#     runner GitHub, pour un bénéfice nul ;
#   - les deux clés recherchées (vite-recaptcha-site-key, vite-backend-url)
#     n'existaient pas dans le secret, la récupération échouait donc en silence
#     et VITE_BACKEND_URL retombait systématiquement sur sa valeur par défaut.
# Vérifié : plus aucun secret déclaré sur le repo, KUBE_CONFIG_DATA est bien parti.
#
# ── CORRECTIONS APPORTÉES ────────────────────────────────────────────────────
#
# 1. L'IMAGE SCANNÉE EST DÉSORMAIS L'IMAGE POUSSÉE.
#    Avant, le scan portait sur `scan-backend:latest` et l'étape de push
#    relançait un `docker build`. Deux builds distincts : rien ne garantissait
#    que l'image publiée soit celle que Trivy avait validée (TOCTOU). On builde
#    maintenant une seule fois avec `load: true`, on scanne, puis on `docker tag`
#    + `docker push` exactement ce binaire-là.
#
# 2. LE PIN DE DIGEST EST VÉRIFIÉ.
#    Les `sed` n'étaient jamais contrôlés. Si l'indentation de values.yaml
#    changeait, le sed ne matchait rien, `git diff --staged --quiet` renvoyait
#    vrai, et le job affichait « already up to date » en vert — sans avoir rien
#    déployé. Échec silencieux. On vérifie maintenant avant ET après.
#
# 3. cancel-in-progress: false.
#    Ce job pousse des images et commite. Le tuer entre le push GHCR et le
#    commit du digest laisse le repo désynchronisé du registre.
#
# 4. Push git avec retry et rebase propre (abort en cas de conflit) au lieu
#    d'un `git pull --rebase` sec qui pouvait laisser un rebase en cours.
#
# 5. Permissions `attestations: write` et `id-token: write` retirées : elles
#    étaient déclarées mais aucune étape ne générait d'attestation.

name: Build and push to GHCR

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main

env:
  REGISTRY: ghcr.io
  # 0.69.3 -> 0.73.0 : la base de vulnérabilités est retéléchargée à chaque
  # exécution, mais le binaire, lui, était figé — et c'est lui qui porte les
  # améliorations de détection et le support des nouveaux formats de paquets.
  TRIVY_IMAGE: aquasec/trivy:0.73.0
  PNPM_VERSION: 10.33.4
  NODE_VERSION: '26'

permissions:
  contents: read
  packages: write

# false et non true : ce job pousse des images sur GHCR puis commite le digest.
# Une annulation en plein milieu laisse une image publiée que values.yaml ne
# référence pas.
concurrency:
  group: build-and-push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      - name: Backend – install
        working-directory: Backend
        run: pnpm install --frozen-lockfile

      # Bloquant : restreint aux dépendances de production, une CVE HIGH qui part
      # en prod fait échouer le build. Les exceptions justifiées se déclarent
      # dans pnpm.auditConfig.ignoreGhsas du package.json, pas en ignorant
      # l'ensemble du résultat.
      #
      # Le `--prod` n'est pas cosmétique : sans lui, une CVE dans vitest ou
      # eslint bloque le pipeline alors que ces paquets ne partent jamais en
      # prod. C'est exactement ce qui a mis Domaine-des-reves-bleus en deadlock
      # (aucune PR de correctif ne pouvait passer tant que TOUTES les CVE, y
      # compris devDeps, n'étaient pas corrigées en même temps).
      - name: Backend – audit (prod, high+)
        working-directory: Backend
        run: pnpm audit --prod --audit-level high

      - name: Backend – test (if present)
        working-directory: Backend
        # pnpm run --if-present test  (et NON pnpm test --if-present qui passerait
        # --if-present comme argument du script)
        run: pnpm run --if-present test

      - name: Frontend – install
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend – audit (prod, high+)
        working-directory: Frontend
        run: pnpm audit --prod --audit-level high

      - name: Frontend – lint
        working-directory: Frontend
        run: pnpm lint

      - name: Frontend – typecheck
        working-directory: Frontend
        run: pnpm typecheck

      - name: Frontend – test (if present)
        working-directory: Frontend
        run: pnpm run --if-present test

  build-and-push:
    name: Build and push
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      - name: Bump version (prod)
        id: tag
        run: |
          set -euo pipefail
          CONTENT=$(cat version.txt | tr -d '\r\n ')
          MAJOR=$(echo "$CONTENT" | cut -d. -f1)
          MINOR=$(echo "$CONTENT" | cut -d. -f2)
          PATCH=$(echo "$CONTENT" | cut -d. -f3)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::version.txt invalide: $CONTENT (attendu X.Y.Z)"
            exit 1
          fi
          if [ "$PATCH" -lt 9 ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          TAG="v${NEW_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $CONTENT → $NEW_VERSION (tag: $TAG)"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-backend
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      # Build UNIQUE, chargé dans le démon Docker local. Aucun push ici.
      # C'est ce binaire précis qui sera scanné puis publié.
      - name: Build backend (local)
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          load: true
          push: false
          tags: zenix-backend:candidate
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Trivy scan backend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format table \
            zenix-backend:candidate

      # `docker tag` + `docker push` de l'image déjà scannée, et non un second
      # `docker build` : l'octet publié est l'octet validé par Trivy.
      - name: Push backend
        id: push-backend
        env:
          META_TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          set -euo pipefail
          TARGET=$(printf '%s\n' "$META_TAGS" | head -1)
          docker tag zenix-backend:candidate "$TARGET"
          PUSH_OUT=$(docker push "$TARGET" | tee /dev/stderr)

          DIGEST=$(docker buildx imagetools inspect "$TARGET" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            DIGEST=$(printf '%s\n' "$PUSH_OUT" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1 || true)
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Backend publié : $TARGET (digest: ${DIGEST:-introuvable})"

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Frontend – install & build (dist/ requis par Dockerfile)
        working-directory: Frontend
        env:
          # Le frontend appelle l'API via le même hôte, proxifiée par nginx sur
          # /api : aucune variable de build à récupérer ailleurs.
          VITE_BACKEND_URL: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-front
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build frontend (local)
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          load: true
          push: false
          tags: zenix-front:candidate
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Trivy scan frontend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format table \
            zenix-front:candidate

      - name: Push frontend
        id: push-frontend
        env:
          META_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          set -euo pipefail
          TARGET=$(printf '%s\n' "$META_TAGS" | head -1)
          docker tag zenix-front:candidate "$TARGET"
          PUSH_OUT=$(docker push "$TARGET" | tee /dev/stderr)

          DIGEST=$(docker buildx imagetools inspect "$TARGET" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            DIGEST=$(printf '%s\n' "$PUSH_OUT" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1 || true)
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Frontend publié : $TARGET (digest: ${DIGEST:-introuvable})"

      # ── Pin digest dans values.yaml → ArgoCD sync automatique ────────────────
      - name: Pin Helm values to image digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          DIGEST_BACKEND: ${{ steps.push-backend.outputs.digest }}
          DIGEST_FRONTEND: ${{ steps.push-frontend.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REG: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          VALUES_PATH="charts/zenix/values.yaml"

          # Remplace la ligne `image:` d'un composant, en échouant bruyamment si
          # elle est introuvable ou si le remplacement n'a pas pris. C'est le
          # garde-fou contre le déploiement fantôme : un sed muet passait au vert
          # sans rien changer.
          update_image() {
            local key="$1" newref="$2"
            if ! grep -qE "^[[:space:]]+image:[[:space:]]*ghcr\.io/.*${key}[@:]" "$VALUES_PATH"; then
              echo "::error::Aucune ligne 'image:' pour ${key} dans ${VALUES_PATH}. Le pin de digest aurait échoué en silence."
              exit 1
            fi
            sed -i -E "s|^([[:space:]]+)image:[[:space:]]*ghcr\.io/.*${key}[@:].*|\1image: ${newref}|" "$VALUES_PATH"
            if ! grep -qF "image: ${newref}" "$VALUES_PATH"; then
              echo "::error::Le remplacement de ${key} n'a pas pris dans ${VALUES_PATH}."
              exit 1
            fi
            echo "  ${key} → ${newref}"
          }

          if [ -n "${DIGEST_BACKEND:-}" ]; then
            BACKEND_IMAGE="${REG}/${OWNER}/zenix-backend@${DIGEST_BACKEND}"
          else
            BACKEND_IMAGE="${REG}/${OWNER}/zenix-backend:${TAG}"
            echo "::warning::Digest backend introuvable, pin sur le tag ${TAG} (déploiement OK mais non immuable)."
          fi
          if [ -n "${DIGEST_FRONTEND:-}" ]; then
            FRONTEND_IMAGE="${REG}/${OWNER}/zenix-front@${DIGEST_FRONTEND}"
          else
            FRONTEND_IMAGE="${REG}/${OWNER}/zenix-front:${TAG}"
            echo "::warning::Digest frontend introuvable, pin sur le tag ${TAG} (déploiement OK mais non immuable)."
          fi

          update_image "zenix-backend" "$BACKEND_IMAGE"
          update_image "zenix-front"   "$FRONTEND_IMAGE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt "$VALUES_PATH"

          if git diff --staged --quiet; then
            echo "::warning::Rien à commiter alors que le pin a réussi — values.yaml pointait déjà sur ce digest."
          else
            git commit -m "chore(helm): pin images to digest ${TAG} [skip ci]"

            # Retry : un autre workflow peut avoir poussé entre-temps. En cas de
            # conflit de rebase on abort proprement plutôt que de laisser le
            # dépôt dans un état intermédiaire.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then
                pushed=true
                break
              fi
              echo "::warning::Push refusé (tentative ${attempt}/3), rebase sur origin/${BRANCH}…"
              git fetch origin "$BRANCH"
              if ! git rebase "origin/${BRANCH}"; then
                git rebase --abort || true
                echo "::error::Conflit de rebase sur ${BRANCH}, intervention manuelle requise."
                exit 1
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Impossible de pousser le pin de digest après 3 tentatives."
              exit 1
            fi
          fi

          {
            echo "### Déploiement ${TAG}"
            echo "- Backend : \`${BACKEND_IMAGE}\`"
            echo "- Frontend : \`${FRONTEND_IMAGE}\`"
            echo ""
            echo "Images scannées par Trivy avant publication. ArgoCD synchronise le cluster dans les minutes qui suivent."
          } >> "$GITHUB_STEP_SUMMARY"
