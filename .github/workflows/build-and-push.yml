# Build & push : main -> bump version + scan Trivy + push GHCR + pin digest dans values.yaml
# ArgoCD reprend ensuite le relai et déploie sur le cluster.
#
# Runners GitHub-hosted ubuntu-latest (illimités pour repo public).
# pnpm + minimum-release-age 24h pour défense supply-chain.
#
# Secrets GitHub requis : aucun en dehors du GITHUB_TOKEN fourni par la plateforme.
#
# Le workflow montait auparavant un kubeconfig complet du cluster sur le runner
# pour lire zenix-backend-secrets et en extraire deux variables de build. Cette
# étape a été supprimée :
#   - elle exposait l'intégralité du secret (clé privée JWT, token Gotify) à un
#     runner GitHub, pour un bénéfice nul ;
#   - les deux clés recherchées (vite-recaptcha-site-key, vite-backend-url)
#     n'existaient pas dans le secret, la récupération échouait donc en silence
#     et VITE_BACKEND_URL retombait systématiquement sur sa valeur par défaut.
# Le secret GitHub KUBE_CONFIG_DATA peut être révoqué et supprimé.

name: Build and push to GHCR

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  PNPM_VERSION: 10.33.4
  NODE_VERSION: '26'

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: build-and-push-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      - name: Backend – install
        working-directory: Backend
        run: pnpm install --frozen-lockfile

      # Bloquant : restreint aux dépendances de production, une CVE HIGH qui part
      # en prod fait échouer le build. Les exceptions justifiées se déclarent
      # dans pnpm.auditConfig.ignoreGhsas du package.json, pas en ignorant
      # l'ensemble du résultat.
      - name: Backend – audit (prod, high+)
        working-directory: Backend
        run: pnpm audit --prod --audit-level high

      - name: Backend – test (if present)
        working-directory: Backend
        # pnpm run --if-present test  (et NON pnpm test --if-present qui passerait
        # --if-present comme argument du script)
        run: pnpm run --if-present test

      - name: Frontend – install
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend – audit (prod, high+)
        working-directory: Frontend
        run: pnpm audit --prod --audit-level high

      - name: Frontend – lint
        working-directory: Frontend
        run: pnpm lint

      - name: Frontend – typecheck
        working-directory: Frontend
        run: pnpm typecheck

      - name: Frontend – test (if present)
        working-directory: Frontend
        run: pnpm run --if-present test

  build-and-push:
    name: Build and push
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: |
            Backend/pnpm-lock.yaml
            Frontend/pnpm-lock.yaml

      - name: Bump version (prod)
        id: tag
        run: |
          CONTENT=$(cat version.txt | tr -d '\r\n ')
          MAJOR=$(echo "$CONTENT" | cut -d. -f1)
          MINOR=$(echo "$CONTENT" | cut -d. -f2)
          PATCH=$(echo "$CONTENT" | cut -d. -f3)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "version.txt invalide: $CONTENT (attendu X.Y.Z)"
            exit 1
          fi
          if [ "$PATCH" -lt 9 ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          TAG="v${NEW_VERSION}"
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $CONTENT → $NEW_VERSION (tag: $TAG)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────────────────────────
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-backend
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      # Étape 1 : build local pour le scan Trivy (pas de push)
      - name: Build backend (local — pour scan Trivy)
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          load: true
          push: false
          tags: scan-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      # Étape 2 : scan AVANT push — image vulnérable ne part JAMAIS dans GHCR
      - name: Trivy scan backend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format table \
            scan-backend:latest

      # Étape 3 : push uniquement si le scan est clean
      - name: Push backend
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: ./Backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          pull: true

      # ── Frontend ─────────────────────────────────────────────────────────────
      - name: Frontend – install & build (dist/ requis par Dockerfile)
        working-directory: Frontend
        env:
          # Le frontend appelle l'API via le même hôte, proxifiée par nginx sur
          # /api : aucune variable de build à récupérer ailleurs.
          VITE_BACKEND_URL: /api
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/zenix-front
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build frontend (local — pour scan Trivy)
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          load: true
          push: false
          tags: scan-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Trivy scan frontend (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format table \
            scan-frontend:latest

      - name: Push frontend
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./Frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          pull: true

      # ── Pin digest dans values.yaml → ArgoCD sync automatique ────────────────
      - name: Pin Helm values to image digest
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DIGEST_BACKEND="${{ steps.build-backend.outputs.digest }}"
          DIGEST_FRONTEND="${{ steps.build-frontend.outputs.digest }}"
          OWNER="${{ github.repository_owner }}"
          REG="${{ env.REGISTRY }}"

          if [ -n "$DIGEST_BACKEND" ]; then
            BACKEND_IMAGE="${REG}/${OWNER}/zenix-backend@${DIGEST_BACKEND}"
          else
            BACKEND_IMAGE="${REG}/${OWNER}/zenix-backend:${TAG}"
          fi
          if [ -n "$DIGEST_FRONTEND" ]; then
            FRONTEND_IMAGE="${REG}/${OWNER}/zenix-front@${DIGEST_FRONTEND}"
          else
            FRONTEND_IMAGE="${REG}/${OWNER}/zenix-front:${TAG}"
          fi

          VALUES_PATH="charts/zenix/values.yaml"

          sed -i "s|  image: ghcr.io/.*zenix-backend.*|  image: ${BACKEND_IMAGE}|" "$VALUES_PATH"
          sed -i "s|  image: ghcr.io/.*zenix-front.*|  image: ${FRONTEND_IMAGE}|" "$VALUES_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version.txt "$VALUES_PATH"

          if git diff --staged --quiet; then
            echo "Helm values already up to date, skip commit"
          else
            git commit -m "chore(helm): pin images to digest $TAG [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
