# Default values for zenix (prod)
# Les images sont mises à jour par la CI (workflow build-and-push)

namespace: zenix
nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-secret

# Backend (Node)
backend:
  image: ghcr.io/emmguardia/zenix-backend@sha256:90c7cae49eefa3e006765d05b4ce9ba9c5fb36c69a09a37e1ceb978f374d7a95
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  env:
    PORT: "3000"
    NODE_ENV: production
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    EMAIL_SERVICE_URL: http://email-service.email-service.svc.cluster.local:8080
    ALLOWED_ORIGINS: "https://www.zenixweb.fr,http://localhost:5173"
  secretName: zenix-backend-secrets
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    minReplicas: 1
    maxReplicas: 4
    cpuTarget: 70
    memoryTarget: 80

# Frontend (nginx)
frontend:
  image: ghcr.io/emmguardia/zenix-front@sha256:978c1cb35b89a48f818fa388fb8f21648b516000ebb52d3d5eb17ac517ebdd0d
  imagePullPolicy: Always
  replicas: 1
  serviceType: NodePort
  port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  hpa:
    minReplicas: 1
    maxReplicas: 4
    cpuTarget: 70
    memoryTarget: 80
