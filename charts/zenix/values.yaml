# Default values for zenix (prod)
# Les images sont mises à jour par la CI (workflow build-and-push)

namespace: zenix
nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-secret

# Backend (Node)
backend:
  image: ghcr.io/emmguardia/zenix-backend@sha256:156a70f29281748a375c50c41c3fc28d4220e9243bbb703e661196f0de496d18
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  env:
    PORT: "3000"
    NODE_ENV: production
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    EMAIL_SERVICE_URL: http://email-service.email-service.svc.cluster.local:8080
    # Apex en premier : c'est l'origine réelle vue par le navigateur, www étant
    # redirigé vers elle. localhost n'a rien à faire dans les origines autorisées
    # en production (il est conservé comme défaut dans server.js pour le dev).
    ALLOWED_ORIGINS: "https://zenixweb.fr,https://www.zenixweb.fr"
  secretName: zenix-backend-secrets
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    minReplicas: 1
    maxReplicas: 4
    cpuTarget: 70
    memoryTarget: 80

# Frontend (nginx)
frontend:
  image: ghcr.io/emmguardia/zenix-front@sha256:7888e693c6c109acb206419cddefe60558e71790c32b45cc4012316b6f02d777
  imagePullPolicy: Always
  replicas: 1
  serviceType: NodePort
  # Port exposé par le Service (inchangé : l'IngressRoute pointe dessus).
  port: 80
  # Port écouté dans le conteneur. L'image nginx-unprivileged tourne en uid 101
  # et ne peut donc pas se binder sur un port < 1024.
  containerPort: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  hpa:
    minReplicas: 1
    maxReplicas: 4
    cpuTarget: 70
    memoryTarget: 80
