# Default values for zenix (prod)
# Les images sont mises à jour par la CI (workflow build-and-push)

namespace: zenix
nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: ghcr-secret

# Backend (Node)
backend:
  image: ghcr.io/emmguardia/zenix-backend@sha256:98f2462a62c02f2c01ef427d057dbb269e83046c7320ffb14386700cf8db7e1e
  imagePullPolicy: IfNotPresent
  replicas: 1
  port: 3000
  env:
    PORT: "3000"
    NODE_ENV: production
    JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private_key.pem
    EMAIL_SERVICE_URL: http://email-service.email-service.svc.cluster.local:8080
    CERVEAU_WEBHOOK_URL: https://cerveau.zenixweb.fr/api/hooks/contact
    # Apex en premier : c'est l'origine réelle vue par le navigateur, www étant
    # redirigé vers elle. localhost n'a rien à faire dans les origines autorisées
    # en production (il est conservé comme défaut dans server.js pour le dev).
    ALLOWED_ORIGINS: "https://zenixweb.fr,https://www.zenixweb.fr"
  secretName: zenix-backend-secrets
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    minReplicas: 1
    maxReplicas: 4
    cpuTarget: 70
    memoryTarget: 80

# Frontend (nginx)
frontend:
  image: ghcr.io/emmguardia/zenix-front@sha256:6dbbfe2f21b8249d19267b5da5ef01357efcc4614512a6c22d9f572a5159889a
  imagePullPolicy: Always
  replicas: 2
  serviceType: NodePort
  # Port exposé par le Service (inchangé : l'IngressRoute pointe dessus).
  port: 80
  # Port écouté dans le conteneur. L'image nginx-unprivileged tourne en uid 101
  # et ne peut donc pas se binder sur un port < 1024.
  containerPort: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
  hpa:
    minReplicas: 2
    maxReplicas: 4
    cpuTarget: 70
    memoryTarget: 80
