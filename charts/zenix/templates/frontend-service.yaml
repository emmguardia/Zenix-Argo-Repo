apiVersion: v1
kind: Service
metadata:
  name: zenix-service
  namespace: {{ include "zenix.namespace" . }}
  labels:
    {{- include "zenix.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.serviceType }}
  selector:
    app: zenix-web
  ports:
  - protocol: TCP
    port: {{ .Values.frontend.port }}
    targetPort: {{ .Values.frontend.containerPort }}
