apiVersion: v1
kind: Service
metadata:
  name: zenix-backend
  namespace: {{ include "zenix.namespace" . }}
  labels:
    {{- include "zenix.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: zenix-backend
  ports:
  - protocol: TCP
    port: {{ .Values.backend.port }}
    targetPort: {{ .Values.backend.port }}
