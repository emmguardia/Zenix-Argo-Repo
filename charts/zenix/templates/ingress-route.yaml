apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zenix-ingress
  namespace: {{ include "zenix.namespace" . }}
  labels:
    {{- include "zenix.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`zenixweb.fr`) || Host(`www.zenixweb.fr`)"
      kind: Rule
      services:
        - name: zenix-service
          port: 80
      middlewares:
        - name: security-headers
        - name: crowdsec-bouncer
          namespace: kube-system
  tls: {}
