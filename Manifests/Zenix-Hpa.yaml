apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zenix-backend-hpa
  namespace: zenix
  labels:
    app.kubernetes.io/part-of: Zenix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zenix-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
