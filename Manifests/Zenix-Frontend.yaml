apiVersion: v1
kind: Service
metadata:
  name: zenix-service
  namespace: zenix
  labels:
    app.kubernetes.io/part-of: Zenix
spec:
  type: NodePort
  selector:
    app: zenix-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenix-web
  namespace: zenix
  labels:
    app.kubernetes.io/part-of: Zenix
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zenix-web
  template:
    metadata:
      labels:
        app: zenix-web
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: nginx
        image: ghcr.io/emmguardia/zenix-front@sha256:b82921b7398afe9cb519cb1df9a76a5156cf1d887c5531cdd45686669a58d4af
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3











