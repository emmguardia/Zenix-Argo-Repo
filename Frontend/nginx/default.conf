# Configuration HTTP (sans SSL) - Version de développement
# Pour activer HTTPS, décommentez les blocs server SSL ci-dessous et configurez les certificats

# Configuration principale HTTP avec www
server {
    listen 80;
    server_name www.zenixweb.fr zenixweb.fr;
    root /usr/share/nginx/html;
    index index.html;

    # Activation HTTP/2 (nécessite SSL pour fonctionner, mais pas d'erreur si désactivé)
    # http2 on;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com;" always;

    # --- RÈGLE DE SÉCURITÉ ESSENTIELLE ---
    # Bloque l'accès à tous les fichiers et dossiers qui commencent par un point,
    # comme .env, .git, .gitignore, .htaccess, etc.
    location ~ /\. {
        deny all;
        # Retourne 404 Not Found au lieu de 403 Forbidden pour ne pas confirmer
        # l'existence du fichier.
        return 404; 
    }
    # ----------------------------------------------

    # Images : cache 1 an (assets statiques rarement modifiés)
    location ^~ /images/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Assets avec hash (JS, CSS) : cache 1 an immutable (nouveau hash à chaque déploiement)
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sitemap et robots.txt
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        try_files $uri =404;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy vers le backend API
    location /api/ {
        proxy_pass http://zenix-backend.zenix.svc.cluster.local:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # index.html : cache court pour toujours servir la dernière version du SPA
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "index, follow" always;
    }

    # Configuration SPA - toutes les routes vers index.html (cache court pour mise à jour)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "index, follow" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
}

