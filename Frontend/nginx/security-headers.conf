# Headers de sécurité — snippet inclus dans CHAQUE location.
#
# POURQUOI UN SNIPPET ET PAS UN SIMPLE BLOC server ?
# nginx n'hérite PAS les `add_header` du bloc parent dès qu'un bloc enfant
# déclare ses propres `add_header`. Historiquement, ce fichier avait tous les
# headers au niveau `server`, mais chaque `location` définissait un
# `add_header Cache-Control ...` — ce qui écrasait silencieusement l'intégralité
# des headers de sécurité, CSP compris. Résultat : aucun CSP n'était servi en
# production alors que la config donnait l'impression du contraire.
#
# Règle à respecter : toute nouvelle `location` qui ajoute un `add_header`
# DOIT inclure ce fichier, sinon elle perd tous les headers ci-dessous.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# CSP.
#
#  - script-src : plus de 'unsafe-inline'. C'est le changement qui compte — sans
#    lui, la CSP ne protégeait quasiment pas d'une XSS, puisqu'un script injecté
#    en ligne s'exécutait quand même. Deux choses le rendaient obligatoire, les
#    deux ont été supprimées : le script inline anti-Umami d'index.html, et
#    l'attribut `onload=` posé sur les <link> CSS par le plugin css-async de
#    vite.config.ts. Il ne reste aucun script inline exécutable dans la page.
#
#    Les blocs <script type="application/ld+json"> ne sont PAS concernés : un
#    type non-JavaScript fait du script un « bloc de données » que le HTML
#    n'exécute jamais, la vérification CSP n'est donc pas déclenchée. Le JSON-LD
#    reste lu par les moteurs.
#
#  - style-src conserve 'unsafe-inline' : React pose des styles via l'attribut
#    `style` (couvert par style-src-attr, qui retombe sur style-src). Le retirer
#    demanderait de purger tous les `style={{...}}` des composants.
#
#  - font-src 'self' : Inter est auto-hébergée (@fontsource-variable/inter,
#    importée dans src/index.css). Plus aucune référence à fonts.googleapis.com
#    ni fonts.gstatic.com — donc plus aucune adresse IP visiteur transmise hors
#    UE pour afficher une police.
#
#  - img-src 'self' data: — le `https:` générique a été retiré : le site ne
#    charge aucune image tierce. Une image externe ajoutée plus tard sera
#    bloquée, et c'est le comportement voulu.
#
#  - frame-ancestors 'none' + X-Frame-Options DENY : le site n'est embarqué
#    nulle part et ne contient aucune iframe.
#
#  - 'unsafe-eval' avait déjà été retiré : le build de production n'en a pas besoin.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'self'; script-src 'self' https://umami.zenixweb.fr; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://umami.zenixweb.fr; manifest-src 'self'; upgrade-insecure-requests" always;
