# Headers de sécurité — snippet inclus dans CHAQUE location.
#
# POURQUOI UN SNIPPET ET PAS UN SIMPLE BLOC server ?
# nginx n'hérite PAS les `add_header` du bloc parent dès qu'un bloc enfant
# déclare ses propres `add_header`. Historiquement, ce fichier avait tous les
# headers au niveau `server`, mais chaque `location` définissait un
# `add_header Cache-Control ...` — ce qui écrasait silencieusement l'intégralité
# des headers de sécurité, CSP compris. Résultat : aucun CSP n'était servi en
# production alors que la config donnait l'impression du contraire.
#
# Règle à respecter : toute nouvelle `location` qui ajoute un `add_header`
# DOIT inclure ce fichier, sinon elle perd tous les headers ci-dessous.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# CSP.
#  - script-src   : le SPA + le script Umami auto-hébergé (analytics.zenixweb.fr).
#  - 'unsafe-inline' reste nécessaire tant que le chargement CSS asynchrone passe
#    par un attribut inline `onload=` (voir vite.config.ts, plugin css-async) et
#    que index.html embarque un script inline. À retirer le jour où ces deux
#    points passent par des fichiers externes ou des hash CSP.
#  - 'unsafe-eval' a été retiré : le build de production React/Vite n'en a pas besoin.
#  - Les références à Google Tag Manager / Google Analytics ont été supprimées :
#    le site n'utilise plus que Umami.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://analytics.zenixweb.fr; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://analytics.zenixweb.fr; manifest-src 'self'; upgrade-insecure-requests" always;
