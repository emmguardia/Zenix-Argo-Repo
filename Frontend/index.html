<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/images/Logo.webp" />
    <link rel="preload" as="image" href="/images/Logo.webp" fetchpriority="high" />

    <!--
      Aucun script inline ici — c'est ce qui permet à la CSP de se passer de
      `script-src 'unsafe-inline'` (voir nginx/security-headers.conf).

      Un correctif maison interceptait auparavant `fetch` et `XMLHttpRequest`
      pour bloquer les appels vers api.umami.is. Il a été retiré :
        - il remplaçait `XMLHttpRequest.prototype.open` par une fonction qui
          n'appelait jamais l'originale, laissant l'objet en readyState 0 :
          toute bibliothèque enchaînant sur setRequestHeader() aurait levé une
          InvalidStateError, et `send()` sortait sans jamais émettre load,
          error ni timeout — un appelant serait resté en attente indéfiniment ;
        - les patches étaient globaux et permanents, donc appliqués à toute
          dépendance future de la page ;
        - la CSP fait déjà ce travail au niveau du navigateur, via
          `connect-src 'self' https://umami.zenixweb.fr`, sans toucher aux
          prototypes JavaScript.
      Si des appels à api.umami.is réapparaissent, la cause est côté serveur
      Umami (télémétrie de l'instance), pas ici.
    -->

    <!--
      Tout ce qui se trouve entre SEO:START et SEO:END est REMPLACÉ page par page
      au moment du build par scripts/prerender-seo.mjs, à partir de
      src/config/routes.ts.

      Ne pas modifier ces balises à la main : les valeurs ci-dessous ne servent
      que de repli pour `pnpm dev`, où le pré-rendu ne tourne pas. La vérité est
      dans seoConfig.ts.
    -->
    <!--SEO:START-->
    <title>Zenix Web | Création de site web et hébergement à Lyon</title>
    <meta name="description" content="Création de sites vitrine, e-commerce et landing pages, avec hébergement managé et maintenance en France. Devis gratuit sous 24h.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://zenixweb.fr/">
    <!--SEO:END-->

    <!-- Aucune référence à Google Fonts : Inter est auto-hébergée et importée
         depuis src/index.css, donc incluse dans le bundle CSS servi par notre
         origine. Plus de preconnect, plus de résolution DNS tierce, plus
         d'adresse IP visiteur transmise hors UE. -->

    <!-- Umami Analytics — auto-hébergé, sans cookie -->
    <script async defer data-website-id="d7c3ac5d-03ad-4ce3-8f0c-07706489b71d"
            data-host-url="https://umami.zenixweb.fr"
            src="https://umami.zenixweb.fr/script.js">
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
