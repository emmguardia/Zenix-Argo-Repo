<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/images/Logo.webp" />
    <link rel="preload" as="image" href="/images/Logo.webp" fetchpriority="high" />

    <!-- Interception des requêtes Umami vers api.umami.is (doit être en premier) -->
    <script>
    (function() {
        if (window._umamiBlocked) return;
        window._umamiBlocked = true;

        var originalFetch = window.fetch;
        window.fetch = function(url, options) {
            if (typeof url === 'string' && url.includes('api.umami.is')) {
                return Promise.reject(new Error('Blocked'));
            }
            return originalFetch.apply(this, arguments);
        };

        var originalXHROpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
            if (typeof url === 'string' && url.includes('api.umami.is')) {
                this._blocked = true;
                return;
            }
            return originalXHROpen.apply(this, arguments);
        };

        var originalXHRSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function(data) {
            if (this._blocked) {
                return;
            }
            return originalXHRSend.apply(this, arguments);
        };
    })();
    </script>

    <!--
      Tout ce qui se trouve entre SEO:START et SEO:END est REMPLACÉ page par page
      au moment du build par scripts/prerender-seo.mjs, à partir de
      src/config/routes.ts.

      Ne pas modifier ces balises à la main : les valeurs ci-dessous ne servent
      que de repli pour `pnpm dev`, où le pré-rendu ne tourne pas. La vérité est
      dans seoConfig.ts.
    -->
    <!--SEO:START-->
    <title>Zenix Web | Création de site web et hébergement à Lyon</title>
    <meta name="description" content="Création de sites vitrine, e-commerce et landing pages, avec hébergement managé et maintenance en France. Devis gratuit sous 24h.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://zenixweb.fr/">
    <!--SEO:END-->

    <!-- Préconnexion aux polices : le DNS et le TLS sont négociés en parallèle
         du rendu, pas au moment où la feuille de style est demandée. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Police chargée en asynchrone pour ne pas bloquer le premier rendu (LCP) -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>

    <!-- Umami Analytics — auto-hébergé, sans cookie -->
    <script async defer data-website-id="d7c3ac5d-03ad-4ce3-8f0c-07706489b71d"
            data-host-url="https://umami.zenixweb.fr"
            src="https://umami.zenixweb.fr/script.js">
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
